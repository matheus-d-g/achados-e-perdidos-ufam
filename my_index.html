<body>
    <!-- Bolhas flutuantes no estilo Frutiger Aero (Anos 2000) -->

    <div class="bolha bolha-2"></div>
    <div class="bolha bolha-3"></div>
    <div class="bolha bolha-4"></div>
    <div class="bolha bolha-5"></div>

    <!--_____________
    |TOPO DO SITE   |
    -----------------
    -->
    <header>
        <h1><i class="fa-solid fa-magnifying-glass"></i> Achados e Perdidos | UFAM</h1>
    </header>

    <main class="container-principal">
        
        <!--________________________________ 
        | SEÇÃO 1: FORMULÁRIO DE CADASTRO   |
        ------------------------------------
        -->
        <section class="secao-cadastro">
            <h3><i class="fa-solid fa-plus"></i> Cadastrar Novo Item</h3>
            
            <form>
                <div class="campo">
                    <label for="item">O que foi encontrado ou perdido?</label>
                    <input type="text" id="item" placeholder="Ex: bixinho de pelucia, Fone de ouvido..." required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria">
                        <option value="chaves">🔑 Chaves</option>
                        <option value="eletronicos">📱 Eletrônicos</option>
                        <option value="documentos">📄 Documentos</option>
                        <option value="outros">🎒 Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="descricao">Descreva o objeto que encontrou(se quiser)</label>
                    <input type="text" id="descricao" placeholder="'capinha de celular', 'cordao', 'um documento'" >
                </div>

                <div class="campo">
                    <label for="local">Em qual local?</label>
                    <select id="local">
                        <option value="" disabled selected>Clique para selecionar um local</option>
                        <option value="blocoA">BLOCO A</option>
                        <option value="blocoB">BLOCO B</option>
                        <option value="blocoC">BLOCO C</option>
                        <option value="blocoD">BLOCO D</option>
                        <option value="blocoE">BLOCO E </option>
                        <option value="RU">Restaurante Universitário</option> 
                        <option value="bosque">bosque &#128064;</option><!-- codigo para colocar dois olinhos-emoji -->
                    </select>
                </div>
                <!--____________________________________________________
                |ESTE NOVO CAMPO VAI APARECER OU MUDAR VIA JAVASCRIPT   |
                ---------------------------------------------------------
                -->
                
                <div class="campo" id="container-salas">
                    <label for="sala">Qual a sala/ambiente?</label>
                    <select id="sala" disabled>
                    <option value="">Selecione primeiro o bloco...</option>
                    </select>
                </div>

                <!--_____________________________________
                |   Agora area do campo, usuario digita num e email |
                -----------------------------------------
                -->
                <div class="campo campo-checkbox" style="display: flex; align-items: center; gap: 10px; margin: 15px 0;">
                        <input type="checkbox" id="na_guarita" style="width: auto; cursor: pointer;">
                        <label for="na_guarita" style="cursor: pointer; margin: 0; font-weight: 600; color: #d97706;">
                            <i class="fa-solid fa-person-shelter"></i> Deixei este objeto na guarita/portaria
                        </label>
                </div><!-- ===================================================================
                                    ATUALIZANDO: coloquei essa opção pro usuario            |
                                    Q optou por nao colocar seus dados, vai da pessoa       |
                                    se ela agir de má fé e levar pra casa...                |
                    =========================================================================-->

                <div class="campo">
                    <label for="contato">Seu contato (WhatsApp) </label>
                    <!-- O pattern garante: DDD entre 11 e 99 + o número 9 + 8 dígitos numéricos -->
                    <input type="tel" id="contato" placeholder="Ex: 92999991111" pattern="[1-9]{2}9[0-9]{8}" title="Digite o DDD e o número completo (ex: 92999991111), apenas números.">
                </div>

                <div class="campo">
                    <label for="E-mail">Seu E-mail</label>
                    <!-- Mudar para type="email" força o navegador a exigir o caractere "@" e um domínio válido -->
                    <input type="email" id="E-mail" placeholder="Ex: fulano.silva@ufam.edu.br">
                </div>

                <button type="submit">
                    <i class="fa-solid fa-database"></i> Adicionar
                </button>
            </form>
        </section>

        <!-- ________________________________
        | SEÇÃO 2: GRID DE ITENS ENCONTRADOS   |
        -------------------------------------
        -->

        ================================-->

            <h3><i class="fa-solid fa-list-check"></i> Itens Achados</h3>
    
            <!-- VAZIO. Para o JS preencher aqui -->
            <div class="grid-itens" id="grid-produtos-dinamico">
            <!-- Os cards sumiram daqui e vão entrar via JavaScript -->
            </div>
